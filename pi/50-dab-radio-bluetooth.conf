# WirePlumber's Bluetooth side for the radio's account, kept up when the radio's
# session on tty1 ends. pi/install.sh puts this into the home of the radio's account:
#
#   ~/.config/wireplumber/wireplumber.conf.d/50-dab-radio-bluetooth.conf
#
# then restart WirePlumber (systemctl --user restart wireplumber) or the Pi. Every other
# account has Bluetooth off (pi/50-dab-radio-no-bluetooth.conf in /etc); WirePlumber
# reads the fragments in a user's home after those in /etc, so this turns it on again.
#
# By default WirePlumber runs its BlueZ monitor only while the user has an active
# session on a seat (logind). `systemctl restart dab-radio` ends the login session of
# the unit on tty1 and opens a new one; in between WirePlumber unregistered its A2DP
# endpoints at BlueZ, which closed the stream to connected headphones, and registered
# them again. The headphones stayed connected over HFP and AVRCP, so BlueZ and the
# Bluetooth page called them connected, but nobody set A2DP up again: no sound until
# they were disconnected and connected anew (seen on the Pi with WirePlumber 0.5.8 on
# 10.10.2026). Without seat monitoring A2DP lasted through the restart.
wireplumber.profiles = {
  main = {
    hardware.bluetooth = required
    monitor.bluez.seat-monitoring = disabled
  }
}
