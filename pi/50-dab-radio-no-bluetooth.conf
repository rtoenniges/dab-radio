# Leaves Bluetooth to the radio's account: WirePlumber's Bluetooth side stays off in
# every other account. pi/install.sh puts this into /etc/wireplumber/wireplumber.conf.d/
# and pi/50-dab-radio-bluetooth.conf into the home of the radio's account
# (~/.config/wireplumber/wireplumber.conf.d/), which turns it on again there: WirePlumber
# reads the fragments in a user's home after those in /etc.
#
# The PipeWire of every account starts with the account's user manager, at an SSH login
# too (/etc/systemd/user/default.target.wants/pipewire.service on Raspberry Pi OS), and
# its WirePlumber would register A2DP endpoints of its own at BlueZ beside the radio's:
# headphones could end up with the PipeWire of an SSH login rather than with the radio.
# Seat monitoring does not keep it out, since logind calls a session without a seat,
# such as one over SSH, active (Active=yes, State=active, on the Pi on 11.10.2026).
wireplumber.profiles = {
  main = {
    hardware.bluetooth = disabled
  }
}
